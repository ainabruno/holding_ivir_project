version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: holding_ivir_db
    restart: always
    environment:
      MYSQL_DATABASE: holding_ivir
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: holding_user
      MYSQL_PASSWORD: holding_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: holding_ivir_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql+pymysql://holding_user:holding_password@db:3306/holding_ivir
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - PORT=3000
    depends_on:
      - db

volumes:
  mysql_data:
    driver: local
